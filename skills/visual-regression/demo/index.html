<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Visual regression demo</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0d1117; color: #e6edf3;
    font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
    display: grid; place-items: center; height: 100vh;
  }
  .card {
    width: 420px; padding: 24px; border-radius: 12px;
    background: #161b22; border: 1px solid #21262d;
  }
  .label { font-size: 14px; color: #8b949e; letter-spacing: .02em; }
  .value { font-size: 40px; font-weight: 600; font-variant-numeric: tabular-nums; margin: 8px 0 4px; }
  .unit { font-size: 14px; color: #8b949e; }
  .bar { height: 6px; border-radius: 3px; background: #21262d; margin-top: 18px; overflow: hidden; }
  .fill { height: 100%; width: 64%; background: #4C8DFF; }
  .foot { margin-top: 10px; font-size: 12px; color: #6e7681; }
</style>
</head>
<body>
  <section class="card">
    <div class="label">今日抽检合格率</div>
    <div><span class="value">98.6</span><span class="unit"> %</span></div>
    <div class="bar"><div class="fill"></div></div>
    <div class="foot">更新于 14:20 · 样本 1,284 批次</div>
  </section>
</body>
</html>
